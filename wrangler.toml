name = "copaint"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[assets]
directory = "./public"
not_found_handling = "none"

[secrets]
required = ["COP_DB_BASE"]

# ── AI 调度队列 ──
[[queues.producers]]
binding = "AI_QUEUE"
queue = "yellow-river"

[[queues.consumers]]
queue = "yellow-river"
max_batch_size = 1
max_retries = 3

# ── WebSocket Durable Object ──
[[durable_objects.bindings]]
name = "BOARD_HUB"
class_name = "BoardHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardHub"]

[[secrets_store_secrets]]
store_id = "4cac25c20606481c9e202263d45a1d03"
binding = "SECRET"
secret_name = "0xffff"
