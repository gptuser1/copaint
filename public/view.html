<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoPaint 观看模式</title>
  <link rel="stylesheet" href="/js/main.css">
  <style>
    html, body, #root { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
  </style>
  <script>
    // 首屏前按持久化主题设置 data-theme，避免闪烁（默认暗色）
    document.documentElement.dataset.theme = (localStorage.getItem('copaint_theme') === 'light') ? 'light' : 'dark';
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
